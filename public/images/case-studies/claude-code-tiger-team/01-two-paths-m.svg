<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1370" width="700" height="1370" role="img" aria-label="The engineer path to Claude Code clears in three steps. The designer path runs eight gates and ends blocked on four developer-only entitlements.">
  <defs>
    <linearGradient id="sm1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EAF1F5"/>
    </linearGradient>
    <style>
      .h { font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .row { font-size: 26px; fill: #1F2D38; }
      .sub { font-size: 22px; fill: #5A6E7D; }
      .lane { font-size: 20px; letter-spacing: 2.6px; }
    </style>
  </defs>

  <rect width="700" height="1370" fill="url(#sm1)"/>
  <rect x="1" y="1" width="698" height="1368" fill="none" stroke="#013D5B" stroke-opacity="0.18" stroke-width="2"/>

  <text x="36" y="76" class="h" font-size="40" font-weight="500" fill="#013D5B" letter-spacing="-0.5">Two paths to the</text>
  <text x="36" y="122" class="h" font-size="40" font-weight="500" fill="#013D5B" letter-spacing="-0.5">same tool</text>
  <text x="36" y="166" class="h" font-size="24" fill="#5A6E7D">One route existed. It assumed you</text>
  <text x="36" y="198" class="h" font-size="24" fill="#5A6E7D">were an engineer.</text>
  <line x1="36" y1="232" x2="664" y2="232" stroke="#013D5B" stroke-opacity="0.14" stroke-width="2"/>

  <!-- ENGINEER -->
  <text x="36" y="286" class="m lane" fill="#0E7C61">IF YOU WERE AN ENGINEER</text>
  <rect x="36" y="308" width="628" height="286" rx="6" fill="#FFFFFF" stroke="#0E7C61" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="36" y="308" width="628" height="6" fill="#0E7C61"/>

  <line x1="82" y1="372" x2="82" y2="520" stroke="#0E7C61" stroke-opacity="0.35" stroke-width="4"/>
  <circle cx="82" cy="372" r="15" fill="#FFFFFF" stroke="#0276B1" stroke-width="5"/>
  <text x="122" y="366" class="h row">Job role already grants</text>
  <text x="122" y="396" class="h row">the entitlements</text>

  <circle cx="82" cy="446" r="15" fill="#FFFFFF" stroke="#0276B1" stroke-width="5"/>
  <text x="122" y="454" class="h row">Request Claude Code</text>

  <circle cx="82" cy="520" r="18" fill="#0E7C61"/>
  <path d="M74 520 l5 6 10 -12" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="516" class="h row" fill="#0E7C61" font-weight="500">Working install</text>
  <text x="122" y="546" class="h sub">Same afternoon</text>

  <!-- DESIGNER -->
  <text x="36" y="662" class="m lane" fill="#CC2427">IF YOU WERE A DESIGNER</text>
  <rect x="36" y="684" width="628" height="510" rx="6" fill="#FFFFFF" stroke="#CC2427" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="36" y="684" width="628" height="6" fill="#CC2427"/>

  <line x1="82" y1="742" x2="82" y2="1146" stroke="#CC2427" stroke-opacity="0.28" stroke-width="4"/>

  <g class="h">
    <circle cx="82" cy="742" r="13" fill="#FFFFFF" stroke="#0276B1" stroke-width="5"/>
    <text x="122" y="751" class="row">AI coding tools CBT</text>

    <circle cx="82" cy="808" r="15" fill="#CC2427"/>
    <path d="M76 802 l12 12 M88 802 l-12 12" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="122" y="804" class="row" fill="#CC2427" font-weight="500">Claude Code entitlement</text>
    <text x="122" y="832" class="sub" fill="#CC2427">“You are not eligible”</text>

    <circle cx="82" cy="890" r="13" fill="#FFFFFF" stroke="#B8842B" stroke-width="5"/>
    <text x="122" y="886" class="row">GitHub Enterprise Cloud</text>
    <text x="122" y="914" class="sub">Manager approval</text>

    <circle cx="82" cy="962" r="13" fill="#FFFFFF" stroke="#0276B1" stroke-width="5"/>
    <text x="122" y="971" class="row">GitHub training CBT</text>

    <circle cx="82" cy="1018" r="13" fill="#FFFFFF" stroke="#0276B1" stroke-width="5"/>
    <text x="122" y="1027" class="row">Local administrator CBT</text>

    <circle cx="82" cy="1080" r="15" fill="#B8842B"/>
    <text x="82" y="1088" class="m" font-size="20" fill="#FFFFFF" text-anchor="middle">?</text>
    <text x="122" y="1076" class="row" fill="#8A6320" font-weight="500">Non-developer High Flex</text>
    <text x="122" y="1104" class="sub" fill="#8A6320">Not searchable</text>

    <circle cx="82" cy="1146" r="13" fill="#FFFFFF" stroke="#0276B1" stroke-width="5"/>
    <text x="122" y="1155" class="row">Artifactory + proxy bypass</text>
  </g>

  <!-- blocker -->
  <rect x="36" y="1230" width="628" height="112" rx="6" fill="#FFFFFF" stroke="#CC2427" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="36" y="1230" width="8" height="112" fill="#CC2427"/>
  <text x="72" y="1270" class="m" font-size="19" letter-spacing="2" fill="#CC2427">AT THE READINESS CHECK</text>
  <text x="72" y="1306" class="h" font-size="24" fill="#1F2D38">Four more entitlements existed only</text>
  <text x="72" y="1334" class="h" font-size="24" fill="#1F2D38">in a developer version.</text>
</svg>
