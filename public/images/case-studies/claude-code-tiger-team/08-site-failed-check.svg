  <circle cx="1116" cy="31" r="7" fill="none" stroke="#8FB4C9" stroke-width="2"/>
  <line x1="1121" y1="36" x2="1127" y2="42" stroke="#8FB4C9" stroke-width="2" stroke-linecap="round"/>
  <text x="1138" y="38" class="h" font-size="16" fill="#8FB4C9">Search</text>
  <circle cx="1352" cy="31" r="18" fill="#0276B1"/>
  <text x="1352" y="38" class="h" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="500">MT</text>
  <text x="1382" y="37" class="h" font-size="17" fill="#BBD3E1">Thomas-Wicher</text>

  <!-- breadcrumb -->
  <rect x="0" y="62" width="1536" height="46" fill="#FFFFFF"/>
  <line x1="0" y1="108" x2="1536" y2="108" stroke="#013D5B" stroke-opacity="0.12" stroke-width="2"/>
  <text x="28" y="92" class="h" font-size="17" fill="#7B8B99">Developer Experience</text>
  <text x="228" y="92" class="h" font-size="17" fill="#B4C0CA">/</text>
  <text x="246" y="92" class="h" font-size="17" fill="#7B8B99">Onboarding</text>
  <text x="366" y="92" class="h" font-size="17" fill="#B4C0CA">/</text>
  <text x="384" y="92" class="h" font-size="17" fill="#013D5B" font-weight="500">Claude Code</text>

