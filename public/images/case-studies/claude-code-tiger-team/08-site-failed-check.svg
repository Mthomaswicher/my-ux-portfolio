  <rect x="0" y="108" width="300" height="756" fill="#FAFBFC"/>
  <line x1="300" y1="108" x2="300" y2="864" stroke="#013D5B" stroke-opacity="0.1" stroke-width="2"/>
  <text x="28" y="152" class="m lbl">ONBOARDING</text>
  <rect x="0" y="176" width="300" height="42" fill="#0276B1" fill-opacity="0.09"/>
