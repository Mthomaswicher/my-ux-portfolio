<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="1536" height="864" role="img" aria-label="A failed validation on the Claude Code onboarding module, showing the entitlement that is missing, why the platform cannot request it automatically, and the remediation steps inline.">
  <defs>
    <filter id="lift8" x="-8%" y="-12%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#013D5B" flood-opacity="0.12"/>
    </filter>
    <style>
      .h { font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
