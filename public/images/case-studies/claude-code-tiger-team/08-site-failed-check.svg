  <rect x="0" y="0" width="1536" height="62" fill="#013D5B"/>
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
    <line x1="28" y1="25" x2="48" y2="25"/><line x1="28" y1="31" x2="48" y2="31"/><line x1="28" y1="37" x2="48" y2="37"/>
  </g>
  <text x="70" y="39" class="h" font-size="21" fill="#FFFFFF" font-weight="500">Developer Experience</text>
