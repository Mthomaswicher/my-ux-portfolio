  <text x="28" y="480" class="h nav">Platform docs</text>
  <text x="28" y="528" class="h nav">Entitlement catalog</text>
  <text x="28" y="576" class="h nav">Support</text>

  <!-- page header -->
  <text x="336" y="164" class="h" font-size="34" fill="#013D5B" font-weight="500">Claude Code onboarding</text>
  <rect x="768" y="140" width="150" height="28" rx="3" fill="#FBE3E3"/>
  <text x="843" y="160" class="m" font-size="15" fill="#A81E21" text-anchor="middle" letter-spacing="1">ACTION NEEDED</text>

  <text x="336" y="200" class="h" font-size="19" fill="#7B8B99">Provisions access and local tooling for Claude Code. Owner: DevX Platform.</text>

  <rect x="336" y="228" width="1168" height="56" rx="4" fill="#FFFFFF" stroke="#013D5B" stroke-opacity="0.12" stroke-width="2"/>
  <text x="360" y="262" class="h" font-size="19" fill="#46586A">1 of 7 tasks complete</text>
  <rect x="560" y="248" width="360" height="14" rx="7" fill="#E3E9ED"/>
  <rect x="560" y="248" width="52" height="14" rx="7" fill="#0E7C61"/>
  <text x="1480" y="262" class="m" font-size="17" fill="#7B8B99" text-anchor="end">Last validated 09:12</text>

  <!-- task card -->
  <g filter="url(#lift8)">
    <rect x="336" y="308" width="1168" height="518" rx="4" fill="#FFFFFF" stroke="#013D5B" stroke-opacity="0.13" stroke-width="2"/>
  </g>

  <text x="364" y="352" class="m lbl">TASK 2 OF 7</text>
  <text x="364" y="392" class="h" font-size="27" fill="#013D5B" font-weight="500">Configure machine access</text>
  <line x1="364" y1="416" x2="1476" y2="416" stroke="#013D5B" stroke-opacity="0.1" stroke-width="2"/>

  <!-- failure banner -->
  <rect x="364" y="440" width="1112" height="150" rx="4" fill="#FDF3F3" stroke="#CC2427" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="364" y="440" width="5" height="150" fill="#CC2427"/>
  <circle cx="404" cy="478" r="13" fill="#CC2427"/>
  <path d="M399 473 l10 10 M409 473 l-10 10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="430" y="485" class="m" font-size="17" fill="#A81E21">FAIL</text>
  <text x="494" y="485" class="h" font-size="22" fill="#013D5B" font-weight="500">Local Administrator (High Flex) entitlement not found</text>

  <text x="404" y="524" class="h body">Required to install software on a managed device. Tasks 3 through 7 depend on it.</text>
  <text x="404" y="556" class="h" font-size="19" fill="#8A6320">This entitlement does not return in All Access search and cannot be requested from this page.</text>
  <text x="1452" y="578" class="m" font-size="16" fill="#A0AEB9" text-anchor="end">MISSING_REQUIRED_ENTITLEMENT</text>

  <!-- remediation -->
  <text x="364" y="632" class="h" font-size="19" fill="#013D5B" font-weight="500">Remediation</text>

  <circle cx="380" cy="668" r="13" fill="#0276B1"/>
  <text x="380" y="675" class="m" font-size="16" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="408" y="676" class="h body">In All Access, open Request Access and select Local Administrator (High Flex) from the left menu</text>

  <circle cx="380" cy="714" r="13" fill="#0276B1"/>
  <text x="380" y="721" class="m" font-size="16" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="408" y="722" class="h body">Apply for non-developer access, then refresh policies in BeyondTrust and restart</text>

  <circle cx="380" cy="760" r="13" fill="#0276B1"/>
  <text x="380" y="767" class="m" font-size="16" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="408" y="768" class="h body">Return to this task and re-run validation</text>

  <!-- actions -->
  <line x1="364" y1="792" x2="1476" y2="792" stroke="#013D5B" stroke-opacity="0.1" stroke-width="2"/>
  <rect x="1092" y="740" width="188" height="44" rx="3" fill="#FFFFFF" stroke="#0276B1" stroke-width="2"/>
  <text x="1186" y="768" class="h" font-size="18" fill="#0276B1" font-weight="500" text-anchor="middle">Open All Access</text>
  <rect x="1296" y="740" width="180" height="44" rx="3" fill="#0276B1"/>
  <text x="1386" y="768" class="h" font-size="18" fill="#FFFFFF" font-weight="500" text-anchor="middle">Re-run validation</text>

</svg>
