  <text x="1480" y="262" class="m" font-size="17" fill="#7B8B99" text-anchor="end">Last validated 09:41</text>

  <!-- ============ TASK CARD ============ -->
  <g filter="url(#lift)">
    <rect x="336" y="308" width="1168" height="518" rx="4" fill="#FFFFFF" stroke="#013D5B" stroke-opacity="0.13" stroke-width="2"/>
  </g>

  <text x="364" y="352" class="m lbl">TASK 5 OF 7</text>
  <text x="364" y="392" class="h" font-size="27" fill="#013D5B" font-weight="500">Install system dependencies</text>
  <line x1="364" y1="416" x2="1476" y2="416" stroke="#013D5B" stroke-opacity="0.1" stroke-width="2"/>

  <text x="364" y="452" class="h" font-size="19" fill="#013D5B" font-weight="500">Purpose</text>
  <text x="364" y="482" class="h body">Installs the Node runtime, package manager and supporting scripts required to build and run</text>
  <text x="364" y="510" class="h body">applications locally. Tasks 6 and 7 cannot complete without it.</text>

  <text x="364" y="558" class="h" font-size="19" fill="#013D5B" font-weight="500">Prerequisites</text>
  <rect x="364" y="574" width="228" height="30" rx="15" fill="#E7F4EF"/>
  <text x="386" y="595" class="m" font-size="16" fill="#0E7C61">✓ Artifactory token</text>
  <rect x="608" y="574" width="256" height="30" rx="15" fill="#E7F4EF"/>
  <text x="630" y="595" class="m" font-size="16" fill="#0E7C61">✓ High Flex entitlement</text>

  <rect x="364" y="628" width="1112" height="76" rx="4" fill="#0A1A28"/>
  <text x="388" y="674" class="m" font-size="20" fill="#7FD3A8">allset tce:onboarding:install --program=tech-connect</text>
  <rect x="1352" y="646" width="100" height="40" rx="3" fill="#FFFFFF" fill-opacity="0.14"/>
  <text x="1402" y="672" class="h" font-size="17" fill="#C6D6E0" text-anchor="middle">Copy</text>

  <text x="364" y="734" class="h" font-size="17" fill="#7B8B99">Approximate runtime 20 minutes. Sudo credentials will be requested during installation.</text>

  <rect x="364" y="756" width="212" height="46" rx="3" fill="#0276B1"/>
  <text x="470" y="785" class="h" font-size="19" fill="#FFFFFF" font-weight="500" text-anchor="middle">Run validation</text>

  <rect x="600" y="756" width="876" height="46" rx="3" fill="#F2F9F6" stroke="#0E7C61" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="628" cy="779" r="11" fill="#0E7C61"/>
  <path d="M622 779 l4 5 8 -10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="650" y="786" class="m" font-size="17" fill="#0E7C61">PASS</text>
  <text x="716" y="786" class="m" font-size="17" fill="#46586A">node v24.14.0 · npm 11.9.0 · nvm 0.40.4 · scripts installed</text>

  <!-- recreation stamp: annotation layer, deliberately not part of the UI -->
  <g>
    <rect x="1162" y="134" width="342" height="38" rx="19" fill="#1F2D38" fill-opacity="0.92"/>
    <text x="1333" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.4" fill="#FFFFFF" text-anchor="middle">MOCKUP · NOT A LIVE SCREEN</text>
