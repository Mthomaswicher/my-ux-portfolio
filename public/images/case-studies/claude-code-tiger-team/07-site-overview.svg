  <text x="336" y="164" class="h" font-size="34" fill="#013D5B" font-weight="500">Claude Code onboarding</text>
  <rect x="768" y="140" width="132" height="28" rx="3" fill="#FDF0D8"/>
  <text x="834" y="160" class="m" font-size="15" fill="#8A6320" text-anchor="middle" letter-spacing="1">IN PROGRESS</text>

  <text x="336" y="200" class="h" font-size="19" fill="#7B8B99">Provisions access and local tooling for Claude Code. Owner: DevX Platform.</text>

  <rect x="336" y="228" width="1168" height="56" rx="4" fill="#FFFFFF" stroke="#013D5B" stroke-opacity="0.12" stroke-width="2"/>
