  <text x="322" y="37" class="m" font-size="15" fill="#BBD3E1" text-anchor="middle" letter-spacing="1">INTERNAL</text>

  <rect x="1092" y="15" width="222" height="32" rx="3" fill="#FFFFFF" fill-opacity="0.13"/>
  <circle cx="1116" cy="31" r="7" fill="none" stroke="#8FB4C9" stroke-width="2"/>
  <line x1="1121" y1="36" x2="1127" y2="42" stroke="#8FB4C9" stroke-width="2" stroke-linecap="round"/>
