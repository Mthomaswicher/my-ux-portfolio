<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="1536" height="864" role="img" aria-label="The Claude Code onboarding module inside the internal developer experience platform, showing task five with its purpose, prerequisites, command and validation output.">
  <defs>
    <filter id="lift" x="-8%" y="-12%" width="116%" height="124%">
