<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1180" width="1536" height="1180" role="img" aria-label="The sprint plan gave setup one week. Setup ran nine days and consumed the experimentation it was meant to enable.">
  <defs>
    <linearGradient id="surface3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EAF1F5"/>
    </linearGradient>
    <filter id="soft3" x="-15%" y="-30%" width="130%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#013D5B" flood-opacity="0.13"/>
    </filter>
    <style>
      .h  { font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t1 { font-size: 54px; font-weight: 500; fill: #013D5B; letter-spacing: -1px; }
      .t2 { font-size: 27px; fill: #5A6E7D; }
      .lane { font-size: 21px; letter-spacing: 3px; }
      .bar { font-size: 26px; font-weight: 500; fill: #FFFFFF; }
      .tick { font-size: 20px; fill: #5A6E7D; letter-spacing: 1px; }
      .evd { font-size: 25px; font-weight: 500; }
      .evb { font-size: 24px; fill: #5A6E7D; }
    </style>
  </defs>

  <rect width="1536" height="1180" fill="url(#surface3)"/>
  <rect x="1" y="1" width="1534" height="1178" fill="none" stroke="#013D5B" stroke-opacity="0.18" stroke-width="2"/>

  <text x="64" y="120" class="h t1">Where the sprint actually went</text>
  <text x="64" y="168" class="h t2">The charter gave setup one week. It took nine days and swallowed the</text>
  <text x="64" y="204" class="h t2">experimentation it was meant to enable.</text>
  <line x1="64" y1="248" x2="1472" y2="248" stroke="#013D5B" stroke-opacity="0.14" stroke-width="2"/>

  <!-- axis -->
  <g class="m tick">
    <line x1="240" y1="322" x2="1440" y2="322" stroke="#013D5B" stroke-opacity="0.16" stroke-width="2"/>
    <text x="240" y="304" text-anchor="middle">MAR 16</text>
    <text x="640" y="304" text-anchor="middle">MAR 23</text>
    <text x="1040" y="304" text-anchor="middle">MAR 30</text>
    <text x="1440" y="304" text-anchor="middle">APR 3</text>
  </g>

  <!-- planned -->
  <text x="64" y="392" class="m lane" fill="#5A6E7D">PLANNED</text>
  <rect x="240" y="358" width="360" height="64" rx="4" fill="#0276B1" fill-opacity="0.9"/>
  <text x="420" y="399" class="h bar" text-anchor="middle">Setup</text>
  <rect x="620" y="358" width="400" height="64" rx="4" fill="#0E7C61" fill-opacity="0.9"/>
  <text x="820" y="399" class="h bar" text-anchor="middle">Experimentation</text>
  <rect x="1040" y="358" width="400" height="64" rx="4" fill="#013D5B" fill-opacity="0.9"/>
  <text x="1240" y="399" class="h bar" text-anchor="middle">Report out</text>

  <!-- actual -->
  <text x="64" y="546" class="m lane" fill="#CC2427">ACTUAL</text>
  <rect x="240" y="512" width="720" height="64" rx="4" fill="#CC2427" fill-opacity="0.92"/>
  <text x="600" y="553" class="h bar" text-anchor="middle">Setup · 9 days</text>
  <rect x="980" y="512" width="460" height="64" rx="4" fill="#0E7C61" fill-opacity="0.5"/>
  <text x="1210" y="553" class="h bar" text-anchor="middle">Everything else</text>

  <!-- overrun bracket -->
  <line x1="600" y1="462" x2="600" y2="504" stroke="#CC2427" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="5 6"/>
  <line x1="960" y1="462" x2="960" y2="504" stroke="#CC2427" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="5 6"/>
  <line x1="600" y1="474" x2="960" y2="474" stroke="#CC2427" stroke-width="3"/>
  <rect x="668" y="452" width="224" height="44" rx="22" fill="#CC2427"/>
  <text x="780" y="482" class="m" font-size="20" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">4 DAYS OVER</text>

  <!-- event log -->
  <line x1="64" y1="644" x2="1472" y2="644" stroke="#013D5B" stroke-opacity="0.12" stroke-width="2"/>

  <g>
    <circle cx="88" cy="700" r="9" fill="#CC2427"/>
    <text x="122" y="710" class="h evd" fill="#CC2427">Mar 16, access day</text>
    <text x="122" y="746" class="h evb">“Based on our records, you are not eligible to access Claude Code at this time.”</text>

    <circle cx="88" cy="812" r="9" fill="#CC2427"/>
    <text x="122" y="822" class="h evd" fill="#CC2427">Mar 17, the same message</text>
    <text x="122" y="858" class="h evb">A third person hits it. Nobody can say which entitlement is actually missing.</text>

    <circle cx="88" cy="924" r="9" fill="#B8842B"/>
    <text x="122" y="934" class="h evd" fill="#8A6320">Mar 18, found it</text>
    <text x="122" y="970" class="h evb">The non-developer entitlement is not searchable. It is buried in a left-hand nav.</text>

    <circle cx="88" cy="1036" r="9" fill="#0E7C61"/>
    <text x="122" y="1046" class="h evd" fill="#0E7C61">Mar 24, the first app runs</text>
    <text x="122" y="1082" class="h evb">Eight days after access day. Two weeks after the sprint began.</text>
  </g>

  <text x="122" y="1146" class="h" font-size="27" fill="#1F2D38" font-weight="500">The delay was the useful part.</text>
</svg>
