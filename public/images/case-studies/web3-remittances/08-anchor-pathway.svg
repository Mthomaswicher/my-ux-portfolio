<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 760" width="1536" height="760" role="img" aria-label="The anchor pathway. An Oportun member deposits dollars through a U.S. anchor, value crosses the Stellar network in seconds, and a local anchor pays out pesos to the recipient.">
  <defs>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1A1A23" flood-opacity="0.10"/>
    </filter>
    <style>
      .h  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t1 { font-size: 52px; font-weight: 600; fill: #1A1A23; letter-spacing: -1px; }
      .t2 { font-size: 26px; fill: #5A5A64; }
      .kick { font-size: 19px; letter-spacing: 3px; fill: #6E6E78; }
      .row { font-size: 27px; fill: #1A1A23; font-weight: 500; }
      .sub { font-size: 22px; fill: #5A5A64; }
      .cur { font-size: 34px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1536" height="760" fill="#FAFAFA"/>
  <rect x="1" y="1" width="1534" height="758" fill="none" stroke="#1A1A23" stroke-opacity="0.14" stroke-width="2"/>

  <text x="64" y="112" class="h t1">The anchor pathway</text>
  <text x="64" y="158" class="h t2">Dollars in through a U.S. anchor, across Stellar in seconds, pesos out through a local one.</text>
  <line x1="64" y1="200" x2="1472" y2="200" stroke="#E4E4E7" stroke-width="2"/>

  <!-- sender -->
  <g filter="url(#soft)"><rect x="64" y="264" width="380" height="300" rx="8" fill="#FFFFFF" stroke="#71717A" stroke-width="1.5"/></g>
  <text x="96" y="322" class="m kick">THE SENDER</text>
  <text x="96" y="368" class="h row">An Oportun member</text>
  <text x="96" y="404" class="h sub">Taps in from the home</text>
  <text x="96" y="434" class="h sub">dashboard and confirms.</text>
  <text x="96" y="508" class="h cur" fill="#1A1A23">US$ in</text>

  <!-- stellar -->
  <g filter="url(#soft)"><rect x="532" y="240" width="472" height="348" rx="8" fill="#FFFFFF" stroke="#71717A" stroke-width="1.5"/></g>
  <rect x="532" y="240" width="472" height="8" fill="#00871D"/>
  <text x="564" y="302" class="m kick">THE STELLAR NETWORK</text>
  <text x="564" y="348" class="h row">Settlement in seconds</text>
  <text x="564" y="396" class="h sub">Anchor 1 &#183; FinClusive, U.S.</text>
  <text x="564" y="426" class="h sub">Anchor 2 &#183; Biccos, MX</text>
  <line x1="564" y1="458" x2="972" y2="458" stroke="#E4E4E7" stroke-width="2"/>
  <text x="564" y="500" class="h sub">Regulated partners on each end</text>
  <text x="564" y="530" class="h sub">handle the ramps in local currency.</text>

  <!-- recipient -->
  <g filter="url(#soft)"><rect x="1092" y="264" width="380" height="300" rx="8" fill="#FFFFFF" stroke="#71717A" stroke-width="1.5"/></g>
  <text x="1124" y="322" class="m kick">THE RECIPIENT</text>
  <text x="1124" y="368" class="h row">Family at home</text>
  <text x="1124" y="404" class="h sub">Paid out in local currency,</text>
  <text x="1124" y="434" class="h sub">no crypto account needed.</text>
  <text x="1124" y="508" class="h cur" fill="#1A1A23">MX$ out</text>

  <!-- arrows -->
  <g stroke="#71717A" stroke-width="3" fill="none">
    <line x1="452" y1="414" x2="516" y2="414"/>
    <line x1="1012" y1="414" x2="1076" y2="414"/>
  </g>
  <g fill="#71717A">
    <path d="M528 414 l-18 -9 0 18 z"/>
    <path d="M1088 414 l-18 -9 0 18 z"/>
  </g>

  <text x="64" y="708" class="h sub">Redrawn from the hackathon deck for this page.</text>
</svg>
