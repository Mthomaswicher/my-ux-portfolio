<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="700" height="800" role="img" aria-label="The two complaints from every interview: peer-to-peer transfers are slow and inconvenient, and PayPal is fast but takes 5 to 11 percent while recipients often have no account.">
  <defs>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1A1A23" flood-opacity="0.10"/>
    </filter>
    <style>
      .h  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t1 { font-size: 34px; font-weight: 600; fill: #1A1A23; letter-spacing: -0.5px; }
      .t2 { font-size: 19px; fill: #5A5A64; }
      .kick { font-size: 15px; letter-spacing: 2px; fill: #00871D; }
      .row { font-size: 22px; fill: #1A1A23; font-weight: 500; }
      .sub { font-size: 17px; fill: #5A5A64; }
    </style>
  </defs>

  <rect width="700" height="800" fill="#FAFAFA"/>
  <rect x="1" y="1" width="698" height="798" fill="none" stroke="#1A1A23" stroke-opacity="0.14" stroke-width="2"/>

  <text x="36" y="72" class="h t1">What members kept saying</text>
  <text x="36" y="106" class="h t2">Two complaints, in every interview.</text>
  <line x1="36" y1="140" x2="664" y2="140" stroke="#E4E4E7" stroke-width="2"/>

  <g filter="url(#soft)"><rect x="36" y="176" width="628" height="240" rx="8" fill="#FFFFFF" stroke="#71717A" stroke-width="1.5"/></g>
  <text x="64" y="228" class="m kick">SLOW</text>
  <text x="64" y="266" class="h row">The counter and the wait</text>
  <text x="64" y="302" class="h sub">Western Union and wires cost the most in time:</text>
  <text x="64" y="328" class="h sub">the trip to a store, cash in hand, and a clock</text>
  <text x="64" y="354" class="h sub">that runs until confirmation.</text>

  <g filter="url(#soft)"><rect x="36" y="448" width="628" height="240" rx="8" fill="#FFFFFF" stroke="#71717A" stroke-width="1.5"/></g>
  <text x="64" y="500" class="m kick">EXPENSIVE</text>
  <text x="64" y="538" class="h row">Fast comes with a toll</text>
  <text x="64" y="574" class="h sub">PayPal fixes the speed and takes 5 to 11% per</text>
  <text x="64" y="600" class="h sub">transfer, and the person receiving the money</text>
  <text x="64" y="626" class="h sub">often has no account.</text>

  <text x="36" y="756" class="h sub">Redrawn from the research deck for this page.</text>
</svg>
