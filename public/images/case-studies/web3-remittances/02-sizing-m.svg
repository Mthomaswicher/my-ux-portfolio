<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="700" height="800" role="img" aria-label="Who sends and how big it is: a large share of Oportun members send remittances, U.S. consumers send 76 billion dollars abroad a year, and 41 million dollars moved in the last 12 months.">
  <defs>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1A1A23" flood-opacity="0.10"/>
    </filter>
    <style>
      .h  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t1 { font-size: 34px; font-weight: 600; fill: #1A1A23; letter-spacing: -0.5px; }
      .t2 { font-size: 19px; fill: #5A5A64; }
      .kick { font-size: 15px; letter-spacing: 2px; fill: #6E6E78; }
      .big { font-size: 48px; font-weight: 600; fill: #00871D; letter-spacing: -1px; }
      .row { font-size: 22px; fill: #1A1A23; font-weight: 500; }
      .sub { font-size: 17px; fill: #5A5A64; }
    </style>
  </defs>

  <rect width="700" height="800" fill="#FAFAFA"/>
  <rect x="1" y="1" width="698" height="798" fill="none" stroke="#1A1A23" stroke-opacity="0.14" stroke-width="2"/>

  <text x="36" y="72" class="h t1">Who sends, and how big it is</text>
  <text x="36" y="106" class="h t2">The two facts that carried the pitch.</text>
  <line x1="36" y1="140" x2="664" y2="140" stroke="#E4E4E7" stroke-width="2"/>

  <g filter="url(#soft)"><rect x="36" y="176" width="628" height="240" rx="8" fill="#FFFFFF" stroke="#71717A" stroke-width="1.5"/></g>
  <text x="64" y="228" class="m kick">OUR USERS</text>
  <text x="64" y="266" class="h row">A financial lifeline</text>
  <text x="64" y="302" class="h sub">A large share of Oportun members send</text>
  <text x="64" y="328" class="h sub">remittances, part of the millions in the U.S.</text>
  <text x="64" y="354" class="h sub">with family abroad to support.</text>

  <g filter="url(#soft)"><rect x="36" y="448" width="628" height="240" rx="8" fill="#FFFFFF" stroke="#71717A" stroke-width="1.5"/></g>
  <text x="64" y="500" class="m kick">THE MARKET</text>
  <text x="64" y="564" class="h big">$76B</text>
  <text x="64" y="602" class="h sub">Sent abroad every year by U.S. consumers,</text>
  <text x="64" y="628" class="h sub">with $41M moved in the last 12 months.</text>

  <text x="36" y="756" class="h sub">Redrawn from the pitch deck for this page.</text>
</svg>
