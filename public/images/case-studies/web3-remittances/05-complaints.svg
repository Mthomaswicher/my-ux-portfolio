<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 620" width="1536" height="620" role="img" aria-label="The two complaints from every interview: peer-to-peer transfers are slow and inconvenient, and PayPal is fast but takes 5 to 11 percent while recipients often have no account.">
  <defs>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1A1A23" flood-opacity="0.10"/>
    </filter>
    <style>
      .h  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t1 { font-size: 52px; font-weight: 600; fill: #1A1A23; letter-spacing: -1px; }
      .t2 { font-size: 26px; fill: #5A5A64; }
      .kick { font-size: 19px; letter-spacing: 3px; fill: #00871D; }
      .row { font-size: 30px; fill: #1A1A23; font-weight: 500; }
      .sub { font-size: 23px; fill: #5A5A64; }
    </style>
  </defs>

  <rect width="1536" height="620" fill="#FAFAFA"/>
  <rect x="1" y="1" width="1534" height="618" fill="none" stroke="#1A1A23" stroke-opacity="0.14" stroke-width="2"/>

  <text x="64" y="112" class="h t1">What members kept saying</text>
  <text x="64" y="158" class="h t2">Two complaints, in every interview.</text>
  <line x1="64" y1="200" x2="1472" y2="200" stroke="#E4E4E7" stroke-width="2"/>

  <g filter="url(#soft)"><rect x="64" y="248" width="684" height="288" rx="8" fill="#FFFFFF" stroke="#71717A" stroke-width="1.5"/></g>
  <text x="100" y="312" class="m kick">SLOW</text>
  <text x="100" y="358" class="h row">The counter and the wait</text>
  <text x="100" y="404" class="h sub">Western Union and wires cost the most in</text>
  <text x="100" y="434" class="h sub">time: the trip to a store, cash in hand, and</text>
  <text x="100" y="464" class="h sub">a clock that runs until confirmation.</text>

  <g filter="url(#soft)"><rect x="788" y="248" width="684" height="288" rx="8" fill="#FFFFFF" stroke="#71717A" stroke-width="1.5"/></g>
  <text x="824" y="312" class="m kick">EXPENSIVE</text>
  <text x="824" y="358" class="h row">Fast comes with a toll</text>
  <text x="824" y="404" class="h sub">PayPal fixes the speed and takes 5 to 11%</text>
  <text x="824" y="434" class="h sub">per transfer, and the person receiving the</text>
  <text x="824" y="464" class="h sub">money often has no account.</text>

  <text x="64" y="576" class="h sub">Redrawn from the research deck for this page.</text>
</svg>
