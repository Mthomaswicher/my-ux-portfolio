<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1010" width="1536" height="1010" role="img" aria-label="Eleven competing recipe apps, from ReciMe at 279,233 ratings to Umami at 464. Every one imports by pasting a link or using the share sheet. Sift is the only one where a bar appears on the page in Safari.">
  <defs>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#101014" flood-opacity="0.10"/>
    </filter>
    <style>
      .h  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t1 { font-size: 52px; font-weight: 600; fill: #101014; letter-spacing: -1px; }
      .t2 { font-size: 26px; fill: #5B5B66; }
      .lane { font-size: 20px; letter-spacing: 3px; fill: #6E6E7A; }
      .app { font-size: 26px; fill: #101014; font-weight: 500; }
      .num { font-size: 22px; fill: #5B5B66; }
      .tag { font-size: 18px; letter-spacing: 1.5px; fill: #6E6E7A; }
      .row { font-size: 27px; fill: #101014; font-weight: 500; }
      .sub { font-size: 22px; fill: #5B5B66; }
    </style>
  </defs>

  <rect width="1536" height="1010" fill="#F8F8FA"/>
  <rect x="1" y="1" width="1534" height="1008" fill="none" stroke="#101014" stroke-opacity="0.14" stroke-width="2"/>

  <text x="64" y="112" class="h t1">Where the category makes you start</text>
  <text x="64" y="158" class="h t2">Twelve rivals audited on the App Store, the eleven with public ratings shown. Capture assumes you come to the app.</text>
  <line x1="64" y1="200" x2="1472" y2="200" stroke="#E4E4E7" stroke-width="2"/>

  <text x="64" y="262" class="m lane">THE FIELD &#183; IMPORT MEANS PASTE A LINK OR THE SHARE SHEET</text>

  <g filter="url(#soft)"><rect x="64" y="292" width="800" height="638" rx="8" fill="#FFFFFF" stroke="#71717A" stroke-width="1.5"/></g>

  <!-- rows: name, ratings -->
  <g>
    <text x="100" y="348" class="h app">ReciMe</text><text x="470" y="348" class="m num">279,233 ratings</text>
    <line x1="100" y1="370" x2="828" y2="370" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="100" y="404" class="h app">AnyList</text><text x="470" y="404" class="m num">80,016</text>
    <line x1="100" y1="426" x2="828" y2="426" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="100" y="460" class="h app">Paprika 3</text><text x="470" y="460" class="m num">53,555</text>
    <line x1="100" y1="482" x2="828" y2="482" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="100" y="516" class="h app">Recipe Keeper</text><text x="470" y="516" class="m num">30,038</text>
    <line x1="100" y1="538" x2="828" y2="538" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="100" y="572" class="h app">Samsung Food</text><text x="470" y="572" class="m num">6,302</text>
    <line x1="100" y1="594" x2="828" y2="594" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="100" y="628" class="h app">Crouton</text><text x="470" y="628" class="m num">2,791</text>
    <line x1="100" y1="650" x2="828" y2="650" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="100" y="684" class="h app">Pestle</text><text x="470" y="684" class="m num">1,788</text>
    <line x1="100" y1="706" x2="828" y2="706" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="100" y="740" class="h app">Flavorish</text><text x="470" y="740" class="m num">1,613</text>
    <line x1="100" y1="762" x2="828" y2="762" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="100" y="796" class="h app">Copy Me That</text><text x="470" y="796" class="m num">1,182</text>
    <line x1="100" y1="818" x2="828" y2="818" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="100" y="852" class="h app">Mela</text><text x="470" y="852" class="m num">853</text>
    <line x1="100" y1="874" x2="828" y2="874" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="100" y="908" class="h app">Umami</text><text x="470" y="908" class="m num">464</text>
  </g>

  <!-- Sift panel -->
  <text x="948" y="262" class="m lane">SIFT</text>
  <g filter="url(#soft)"><rect x="948" y="292" width="524" height="360" rx="8" fill="#FFFFFF" stroke="#71717A" stroke-width="1.5"/></g>
  <rect x="948" y="292" width="524" height="8" fill="#C2181D"/>
  <text x="984" y="356" class="h row">The recipe finds you</text>
  <text x="984" y="400" class="h sub">A Safari extension reads the structured</text>
  <text x="984" y="430" class="h sub">data the site already publishes, and a</text>
  <text x="984" y="460" class="h sub">bar appears on the page.</text>
  <line x1="984" y1="492" x2="1436" y2="492" stroke="#E4E4E7" stroke-width="2"/>
  <text x="984" y="551" class="h sub">No app to open first. Nothing to paste.</text>

  <g filter="url(#soft)"><rect x="948" y="692" width="524" height="238" rx="8" fill="#FFFFFF" stroke="#71717A" stroke-width="1.5"/></g>
  <text x="984" y="756" class="m lane">THE AUDIT LINE</text>
  <text x="984" y="806" class="h row">Zero of twelve claim a</text>
  <text x="984" y="842" class="h row">Safari extension</text>
  <text x="984" y="886" class="h sub">Read from their own store listings.</text>

  <text x="64" y="976" class="h sub">Where the field wins instead: 12 of 12 have a grocery list, 11 of 12 plan meals. Sift competes on capture.</text>
</svg>
